<!DOCTYPE html>
<html>
<head>
<title>Contact - Ipan-dev</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    color: white;
    text-align: center;
    padding: 50px 20px;
    font-family: sans-serif;
    min-height: 100vh;
    animation: fadeIn 1s ease-in;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

h1 {
    font-size: 3em;
    margin-bottom: 10px;
    animation: slideDown 0.8s ease-out;
}

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
}

.subtitle {
    font-size: 1.2em;
    margin-bottom: 30px;
    color: #f0f0f0;
    animation: fadeIn 1s ease-out 0.3s both;
}

nav {
    background: rgba(255,255,255,0.2);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 30px;
    backdrop-filter: blur(10px);
    animation: slideDown 0.6s ease-out;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 10px;
    font-size: 1.1em;
    padding: 8px 16px;
    border-radius: 20px;
    transition: all 0.3s ease;
    display: inline-block;
}

nav a:hover {
    background: white;
    color: #f093fb;
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.contact-links {
    max-width: 500px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.contact-item {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    background: rgba(255,255,255,0.2);
    padding: 20px 25px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
    text-decoration: none;
    color: white;
    transition: all 0.3s ease;
    animation: slideUp 0.6s ease-out both;
    border: 2px solid transparent;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.contact-item:nth-child(1) { animation-delay: 0.3s; }
.contact-item:nth-child(2) { animation-delay: 0.5s; }

.contact-item:hover {
    transform: translateY(-5px) scale(1.02);
    background: rgba(255,255,255,0.3);
    border-color: white;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.contact-icon {
    font-size: 2em;
}

.contact-text {
    text-align: left;
}

.contact-text strong {
    display: block;
    font-size: 1.1em;
    margin-bottom: 3px;
}

.contact-text span {
    font-size: 0.9em;
    color: #f0f0f0;
}

.btn {
    display: inline-block;
    padding: 15px 30px;
    background: white;
    color: #f093fb;
    text-decoration: none;
    border-radius: 50px;
    margin-top: 30px;
    font-weight: bold;
    font-size: 1.1em;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    animation: bounceIn 1s ease-out 0.8s both;
}

@keyframes bounceIn {
    0% { opacity: 0; transform: scale(0.3); }
    50% { opacity: 1; transform: scale(1.05); }
    70% { transform: scale(0.9); }
    100% { transform: scale(1); }
}

.btn:hover {
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    background: #f0f0f0;
}

.footer-note {
    margin-top: 40px;
    font-size: 0.9em;
    color: #f0f0f0;
    animation: fadeIn 1s ease-out 1s both;
}
</style>
</head>
<body>

<nav>
    <a href="index.html">🏠 Home</a>
    <a href="about.html">👤 About</a>
    <a href="contact.html">📧 Contact</a>
</nav>

<h1>Hubungi Aku</h1>
<p class="subtitle">Mau ngobrol, kolaborasi, atau sekadar say hi? Klik salah satu di bawah! 👇</p>

<div class="contact-links">
    <a href="https://www.instagram.com/ipansukamie?stkn=d205Nnp3ZzF6bm5t" target="_blank" class="contact-item">
        <span class="contact-icon">📸</span>
        <div class="contact-text">
            <strong>Instagram</strong>
            <span>@ipansukamie — Klik untuk buka profil</span>
        </div>
    </a>
    <a href="https://whatsapp.com/channel/0029Vb9N4YS7tkjC1K9POI0M" target="_blank" class="contact-item">
        <span class="contact-icon">💬</span>
        <div class="contact-text">
            <strong>Saluran WhatsApp</strong>
            <span>Join saluran untuk update terbaru!</span>
        </div>
    </a>
</div>

<a href="index.html" class="btn">Kembali ke Home</a>

<p class="footer-note">✨ Terima kasih sudah mampir di website-ku!</p>

</body>
</html>
